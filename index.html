<script>
/* =====================================================================
   FULL v5: + Topbar Data Backup/Restore (Tally Style Upload/Download)
   ===================================================================== */

let DB = {
  company: null,
  ledgers: [],
  items: [],
  vouchers: [],
  users: [{username:'admin', password:'admin', role:'admin'}],
  audit: [],
  session: null,
  counters: { sale:1, purchase:1, credit:1, debit:1, payment:1, receipt:1, journal:1, contra:1, mfg:1 }
};

const STATE_CODES = {
  "27":"Maharashtra","07":"Delhi","29":"Karnataka","24":"Gujarat","33":"Tamil Nadu",
  "09":"Uttar Pradesh","19":"West Bengal","08":"Rajasthan","06":"Haryana","23":"Madhya Pradesh",
  "32":"Kerala","36":"Telangana","37":"Andhra Pradesh","21":"Odisha","03":"Punjab",
  "10":"Bihar","22":"Chhattisgarh","34":"Puducherry","30":"Goa","02":"Himachal Pradesh"
};
const GROUPS = ["Cash-in-Hand","Bank Accounts","Sundry Debtors","Sundry Creditors","Sales Accounts","Purchase Accounts","Direct Expenses","Indirect Expenses","Direct Incomes","Indirect Incomes","Current Assets","Current Liabilities","Fixed Assets","Capital Account","Duties & Taxes","Stock-in-Hand"];
const ITEM_TYPES = ["Raw Material","Packing Material","Semi-Finished","Finished Goods"];
const GST_RATES = [0,5,12,18,28];

function save() { try { localStorage.setItem('tallyFullDBv5', JSON.stringify(DB)); } catch(e){ alert("Storage full! Data bahut bada hai."); } }
function load() { 
  // Purane version ka data check karein
  const d = localStorage.getItem('tallyFullDBv5') || localStorage.getItem('tallyFullDBv4') || localStorage.getItem('tallyFullDBv3'); 
  if (d) { try { DB = JSON.parse(d); } catch(e){} } 
  if (!DB.users) DB.users=[{username:'admin',password:'admin',role:'admin'}]; 
  if (!DB.audit) DB.audit=[]; 
  if (!DB.session) DB.session=null; 
}
function resetDB() {
  if (!confirm("Sab data delete ho jayega. Confirm?")) return;
  DB = { company:null, ledgers:[], items:[], vouchers:[], users:[{username:'admin',password:'admin',role:'admin'}], audit:[], session:null, counters:{sale:1,purchase:1,credit:1,debit:1,payment:1,receipt:1,journal:1,contra:1,mfg:1} };
  save(); showView('gateway');
}

function fmt(n) { return Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtQty(n) { return Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:3}); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function today() { return new Date().toISOString().slice(0,10); }
function nowStr() { return new Date().toLocaleString('en-IN'); }
function stateOf(g) { return g && g.length>=2 ? g.slice(0,2) : ""; }
function stateName(c) { return STATE_CODES[c] || c || "-"; }
function isInter(g1,g2) { const s1=stateOf(g1), s2=stateOf(g2); return !!(s1 && s2 && s1!==s2); }
function itemByName(n) { return DB.items.find(i=>i.name===n); }
function ledgerByName(n) { return DB.ledgers.find(l=>l.name===n); }

function audit(action, detail) {
  if (!DB.session) return;
  DB.audit.push({ts: nowStr(), user: DB.session.username, action, detail: detail||''});
  save();
}

function numToWords(num) {
  const a = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function two(n){ if(n<20) return a[n]; return b[Math.floor(n/10)] + (n%10?' '+a[n%10]:''); }
  function three(n){ if(n<100) return two(n); return a[Math.floor(n/100)]+' Hundred'+(n%100?' '+two(n%100):''); }
  if (num===0) return 'Zero';
  let rupees = Math.floor(num), paise = Math.round((num-rupees)*100);
  let str = '';
  const crore = Math.floor(rupees/10000000); rupees%=10000000;
  const lakh = Math.floor(rupees/100000); rupees%=100000;
  const thousand = Math.floor(rupees/1000); rupees%=1000;
  if (crore) str += three(crore)+' Crore ';
  if (lakh) str += three(lakh)+' Lakh ';
  if (thousand) str += three(thousand)+' Thousand ';
  if (rupees) str += three(rupees);
  str = str.trim() + ' Rupees';
  if (paise) str += ' and ' + two(paise) + ' Paise';
  return str + ' Only';
}

function toast(msg, ok=true) {
  const div = document.createElement('div');
  div.className = 'status ' + (ok?'ok':'err');
  div.textContent = msg;
  const c = document.getElementById('content');
  c.insertBefore(div, c.firstChild);
  setTimeout(()=>div.remove(), 3500);
}

/* ---------------- FILE UPLOAD HELPERS ---------------- */
function handleFileUpload(input, previewId) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) return toast("File 2MB se badi nahi honi chahiye!", false);
  const reader = new FileReader();
  reader.onload = function(e) {
    const base64 = e.target.result;
    vState.attachment = { name: file.name, type: file.type, data: base64 };
    const prev = document.getElementById(previewId);
    if (prev) {
      if (file.type.startsWith('image/')) {
        prev.innerHTML = `<img src="${base64}" class="file-preview"><br><span class="small">${file.name}</span>`;
      } else {
        prev.innerHTML = `<span class="badge b2b">📄 ${file.name}</span>`;
      }
    }
  };
  reader.readAsDataURL(file);
}
function removeAttachment(previewId) {
  vState.attachment = null;
  const prev = document.getElementById(previewId);
  if (prev) prev.innerHTML = '';
}

/* ---------------- LOGIN ---------------- */
function renderLogin() {
  document.getElementById('userInfo').textContent = 'Not logged in';
  document.getElementById('content').innerHTML = `
    <div class="login-box">
      <h2>🔐 Login</h2>
      <div class="row"><div><label>Username</label><input id="lgUser" value="admin"></div></div>
      <div class="row"><div><label>Password</label><input id="lgPass" type="password" value="admin"></div></div>
      <div class="row"><div><button class="btn btn-success" style="width:100%" onclick="doLogin()">Login</button></div></div>
      <p class="small center">Default: admin / admin</p>
    </div>`;
}
function doLogin() {
  const u = document.getElementById('lgUser').value.trim();
  const p = document.getElementById('lgPass').value;
  const usr = DB.users.find(x=>x.username===u && x.password===p);
  if (!usr) return toast("Invalid credentials", false);
  DB.session = { username: usr.username, role: usr.role, loginAt: nowStr() };
  audit('LOGIN','User logged in'); save();
  document.getElementById('userInfo').textContent = `👤 ${usr.username} | Logout`;
  document.getElementById('userInfo').onclick = () => { DB.session=null; save(); renderLogin(); };
  showView(DB.company ? 'gateway' : 'company');
}

/* ---------------- ROUTER ---------------- */
let currentView = 'gateway';
function showView(name, arg) {
  if (!DB.session) { renderLogin(); return; }
  currentView = name;
  const c = document.getElementById('content'); c.innerHTML = '';
  if (!DB.company && name !== 'company' && name !== 'admin') {
    c.innerHTML = '<div class="card"><h2>🏢 Pehle Company Banao</h2><button class="btn" onclick="showView(\'company\')">Company Create</button></div>'; return;
  }
  document.getElementById('companyName').textContent = DB.company ? DB.company.name : 'No Company';
  switch(name) {
    case 'gateway': renderGateway(); break;
    case 'company': renderCompany(); break;
    case 'ledger': renderLedger(); break;
    case 'item': renderItem(); break;
    case 'bom': renderBOM(); break;
    case 'reports': renderReports(); break;
    case 'gstReports': renderGSTReports(); break;
    case 'voucher': renderVoucherForm(arg); break;
    case 'bank': renderBankRecon(); break;
    case 'admin': renderAdmin(); break;
  }
}

/* ---------------- GATEWAY ---------------- */
function renderGateway() {
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="card">
      <h2>🏠 Gateway of Tally</h2>
      <p class="small">Company: <b>${DB.company.name}</b> | GSTIN: ${DB.company.gstin||'-'} | State: ${stateName(stateOf(DB.company.gstin))}</p>
      <div class="row" style="margin-top:10px;">
        <div><button class="btn" onclick="showView('ledger')">📒 Ledger</button></div>
        <div><button class="btn" onclick="showView('item')">📦 Item</button></div>
        <div><button class="btn" onclick="showView('bom')">⚙️ BOM</button></div>
        <div><button class="btn" onclick="showView('bank')">🏦 Bank Recon</button></div>
      </div>
      <div class="row">
        <div><button class="btn btn-success" onclick="openVoucher('F8')">🧾 Sale</button></div>
        <div><button class="btn" onclick="openVoucher('F9')">📥 Purchase</button></div>
        <div><button class="btn btn-warn" onclick="openVoucher('F10')">↩️ Credit Note</button></div>
        <div><button class="btn btn-warn" onclick="openVoucher('F11')">↪️ Debit Note</button></div>
      </div>
      <div class="row">
        <div><button class="btn" onclick="openVoucher('F5')">💸 Payment</button></div>
        <div><button class="btn" onclick="openVoucher('F6')">💰 Receipt</button></div>
        <div><button class="btn" onclick="openVoucher('F7')">📘 Journal</button></div>
        <div><button class="btn" onclick="openVoucher('F4')">🔄 Contra</button></div>
        <div><button class="btn" onclick="openVoucher('F12')">🏭 Manufacture</button></div>
      </div>
      <div class="row">
        <div><button class="btn btn-warn" onclick="showView('reports')">📊 Reports</button></div>
        <div><button class="btn btn-success" onclick="showView('gstReports')">🧾 GST Reports</button></div>
        <div><button class="btn" onclick="showView('admin')">⚙️ Admin</button></div>
        <div><button class="btn btn-danger" onclick="resetDB()">🗑️ Reset</button></div>
      </div>
    </div>
    <div class="card">
      <h3>📈 Quick Stats</h3>
      <div class="row">
        <div>Ledgers: <b>${DB.ledgers.length}</b></div>
        <div>Items: <b>${DB.items.length}</b></div>
        <div>Vouchers: <b>${DB.vouchers.length}</b></div>
        <div>Audit: <b>${DB.audit.length}</b></div>
      </div>
    </div>`;
}

/* ---------------- COMPANY ---------------- */
function renderCompany() {
  const c = document.getElementById('content');
  const comp = DB.company || {name:'',gstin:'',address:'',phone:'',email:''};
  c.innerHTML = `
    <div class="card">
      <h2>🏢 Company</h2>
      <div class="row">
        <div><label>Name</label><input id="cName" value="${comp.name||''}"></div>
        <div><label>GSTIN</label><input id="cGstin" value="${comp.gstin||''}" placeholder="27AAAAA0000A1Z5"></div>
      </div>
      <div class="row">
        <div><label>Address</label><input id="cAddr" value="${comp.address||''}"></div>
        <div><label>Phone</label><input id="cPhone" value="${comp.phone||''}"></div>
        <div><label>Email</label><input id="cEmail" value="${comp.email||''}"></div>
      </div>
      <div class="row">
        <div><label>State</label><select id="cState">${Object.entries(STATE_CODES).map(([k,v])=>`<option value="${k}" ${comp.state===k?'selected':''}>${k} - ${v}</option>`).join('')}</select></div>
        <div style="display:flex;align-items:flex-end;"><button class="btn btn-success" onclick="saveCompany()">💾 Save</button></div>
      </div>
    </div>`;
}
function saveCompany() {
  const name = document.getElementById('cName').value.trim();
  if (!name) return toast("Company name zaroori", false);
  const gstin = document.getElementById('cGstin').value.trim().toUpperCase();
  DB.company = { name, gstin, state: gstin?stateOf(gstin):document.getElementById('cState').value, address: document.getElementById('cAddr').value.trim(), phone: document.getElementById('cPhone').value.trim(), email: document.getElementById('cEmail').value.trim() };
  if (!DB.ledgers.length) {
    ['Cash','Bank','Sales A/c','Purchase A/c','Output CGST','Output SGST','Output IGST','Input CGST','Input SGST','Input IGST','Round Off','Stock-in-Hand'].forEach(n=>{
      let g='Current Assets';
      if(n==='Cash')g='Cash-in-Hand'; else if(n==='Bank')g='Bank Accounts';
      else if(n.startsWith('Sales'))g='Sales Accounts'; else if(n.startsWith('Purchase'))g='Purchase Accounts';
      else if(n.startsWith('Output')||n.startsWith('Input'))g='Duties & Taxes';
      else if(n==='Stock-in-Hand')g='Stock-in-Hand';
      if(!ledgerByName(n)) DB.ledgers.push({name:n,group:g,gstin:'',opening:0});
    });
  }
  audit('COMPANY_SAVE', name); save(); toast("Saved!"); showView('gateway');
}

/* ---------------- LEDGER ---------------- */
function renderLedger() {
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="card">
      <h2>📒 Ledger</h2>
      <div class="row">
        <div><label>Name</label><input id="lName"></div>
        <div><label>Group</label><select id="lGroup">${GROUPS.map(g=>`<option>${g}</option>`).join('')}</select></div>
      </div>
      <div class="row">
        <div><label>GSTIN</label><input id="lGstin"></div>
        <div><label>Opening (Dr+/Cr-)</label><input id="lOpening" type="number" value="0"></div>
        <div style="display:flex;align-items:flex-end;"><button class="btn btn-success" onclick="addLedger()">➕ Add</button></div>
      </div>
    </div>
    <div class="card">
      <h3>Ledgers (${DB.ledgers.length})</h3>
      <table><tr><th>Name</th><th>Group</th><th>GSTIN</th><th>State</th><th>Opening</th><th>Action</th></tr>
        ${DB.ledgers.map(l=>`<tr><td>${l.name}</td><td>${l.group}</td><td>${l.gstin||'-'}</td><td>${l.gstin?stateName(stateOf(l.gstin)):'-'}</td><td class="right">${fmt(l.opening)}</td><td><button class="btn btn-danger btn-sm" onclick="delLedger('${l.name}')">Del</button></td></tr>`).join('')}
      </table>
    </div>`;
}
function addLedger() {
  const name = document.getElementById('lName').value.trim();
  if (!name) return toast("Name zaroori", false);
  if (ledgerByName(name)) return toast("Exists", false);
  DB.ledgers.push({name, group:document.getElementById('lGroup').value, gstin:document.getElementById('lGstin').value.trim().toUpperCase(), opening:Number(document.getElementById('lOpening').value)||0});

/* ---------------- STOCK ---------------- */
function currentStock(name) {
  let qty = 0; const it = itemByName(name); if (it) qty += Number(it.openingQty)||0;
  DB.vouchers.forEach(v => (v.stockMoves||[]).forEach(m => { if (m.name===name) qty += Number(m.qty)||0; }));
  return qty;
}

function onPartyChange(name) {

function addLine() {
  const name = document.getElementById('liItem').value; const it = itemByName(name); if (!it) return;
  const qty = Number(document.getElementById('liQty').value)||0; const rate = Number(document.getElementById('liRate').value)||0;
  const gst = Number(document.getElementById('liGst').value)||0; const disc = Number(document.getElementById('liDisc').value)||0;
  if (qty<=0) return toast("Qty>0", false);
  vState.items.push({name, type:it.type, qty, rate, gst, disc, hsn:it.hsn, uom:it.uom}); renderLines(); recalc();
}
function renderLines() {
  const t = document.getElementById('liTable'); if (!t) return;
  const inter = isInter(DB.company.gstin, vState.partyGstin);
  const rows = vState.items.map((li, idx) => {
    const gross = li.qty*li.rate; const amt = gross - gross*(li.disc||0)/100; const g = amt*li.gst/100;
    const cgst=inter?0:g/2, sgst=inter?0:g/2, igst=inter?g:0;
    return `<tr><td>${li.name}</td><td>${li.type}</td><td class="right">${fmtQty(li.qty)} ${li.uom||''}</td><td class="right">${fmt(li.rate)}</td><td class="right">${li.disc||0}%</td><td class="right">${fmt(amt)}</td><td class="right">${li.gst}%</td><td class="right">${fmt(cgst)}</td><td class="right">${fmt(sgst)}</td><td class="right">${fmt(igst)}</td><td><button class="btn btn-danger btn-sm" onclick="vState.items.splice(${idx},1);renderLines();recalc()">Del</button></td></tr>`;
  }).join('');
  t.innerHTML = `<tr><th>Item</th><th>Type</th><th>Qty</th><th>Rate</th><th>Disc</th><th>Amount</th><th>GST%</th><th>CGST</th><th>SGST</th><th>IGST</th><th>Action</th></tr>` + rows;
}
function calcTotals() {
  const inter = isInter(DB.company.gstin, vState.partyGstin);
  let sub=0,cgst=0,sgst=0,igst=0;
  vState.items.forEach(li=>{ const gross = li.qty*li.rate; const amt = gross - gross*(li.disc||0)/100; const g = amt*li.gst/100; sub += amt; if (inter) igst+=g; else { cgst+=g/2; sgst+=g/2; } });
  const round = Math.round(sub+cgst+sgst+igst) - (sub+cgst+sgst+igst);
  return { inter, sub, cgst, sgst, igst, round, total: sub+cgst+sgst+igst+round };
}
function recalc() {
  const el = document.getElementById('vTotals'); if (!el || !vState) return; const t = calcTotals();
  el.innerHTML = `<div><span>Taxable</span><b>₹ ${fmt(t.sub)}</b></div><div><span>CGST</span><b>₹ ${fmt(t.cgst)}</b></div><div><span>SGST</span><b>₹ ${fmt(t.sgst)}</b></div><div><span>IGST</span><b>₹ ${fmt(t.igst)}</b></div><div><span>Round</span><b>₹ ${fmt(t.round)}</b></div><div class="grand"><span>Total</span><b>₹ ${fmt(t.total)}</b></div><div class="small">${t.inter?'🔴 IGST':'🟢 CGST+SGST'} | ${vState.partyGstin?'B2B':'B2C'}</div>`;
}
function recalcMfg() {
  const el = document.getElementById('mfgPreview'); if (!el || !vState.mfgItem) return; const it = itemByName(vState.mfgItem);
  if (!it || !it.bom || !it.bom.length) { el.innerHTML='<p class="small">BOM nahi hai.</p>'; return; }
  const batches = vState.mfgQty/(it.bomOutput||1); let html='<h3>BOM Consumption</h3><table><tr><th>Component</th><th>Qty</th><th>Available</th></tr>'; let ok=true;
  it.bom.forEach(b=>{ const need=b.qty*batches; const avail=currentStock(b.item); if(avail<need)ok=false; html+=`<tr><td>${b.item}</td><td class="right">${fmtQty(need)}</td><td class="right" style="color:${avail<need?'#f66':'#6f6'}">${fmtQty(avail)}</td></tr>`; });
  html+='</table>'; if (!ok) html+='<p class="status err">⚠️ Stock kam hai</p>'; el.innerHTML=html;
}
function saveMfg() {
  if (!vState.mfgItem) return toast("Item select", false); const it = itemByName(vState.mfgItem);
  if (!it || !it.bom || !it.bom.length) return toast("BOM nahi", false);
  const batches = vState.mfgQty/(it.bomOutput||1); let moves = [{name:vState.mfgItem, qty:+vState.mfgQty}]; let ok=true;
  it.bom.forEach(b=>{ const need=b.qty*batches; if(currentStock(b.item)<need) ok=false; moves.push({name:b.item, qty:-need}); });
  if (!ok && !confirm("Stock kam hai. Save?")) return;
  if (vState.editing) { const idx = DB.vouchers.findIndex(x=>x.id===vState.editId); if (idx>=0) { DB.vouchers[idx].date=vState.date; DB.vouchers[idx].stockMoves=moves; DB.vouchers[idx].party=vState.mfgItem; DB.vouchers[idx].attachment=vState.attachment; audit('MFG_EDIT', vState.mfgItem); } save(); toast("Updated!"); vState=null; showView('gateway'); return; }
  DB.vouchers.push({id:uid(),type:'Manufacture',date:vState.date,party:vState.mfgItem,items:[],narration:vState.narration,stockMoves:moves,taxable:0,cgst:0,sgst:0,igst:0,total:0,attachment:vState.attachment});
  audit('MFG_ADD', vState.mfgItem); save(); toast("Saved!"); vState=null; showView('gateway');
}
function saveSimpleVoucher() {
  if (!vState.fromAcc || !vState.toAcc) return toast("Dono accounts", false); if (!vState.amount || vState.amount<=0) return toast("Amount>0", false);
  if (vState.editing) { const idx = DB.vouchers.findIndex(x=>x.id===vState.editId); if (idx>=0) { Object.assign(DB.vouchers[idx], {date:vState.date, fromAcc:vState.fromAcc, toAcc:vState.toAcc, amount:vState.amount, narration:vState.narration, total:vState.amount, attachment:vState.attachment}); audit(vState.type.toUpperCase()+'_EDIT', vState.amount); } save(); toast("Updated!"); vState=null; showView('gateway'); return; }
  DB.vouchers.push({id:uid(),type:vState.type,date:vState.date,fromAcc:vState.fromAcc,toAcc:vState.toAcc,amount:vState.amount,narration:vState.narration,items:[],stockMoves:[],taxable:0,cgst:0,sgst:0,igst:0,total:vState.amount,attachment:vState.attachment});
  audit(vState.type.toUpperCase()+'_ADD', vState.amount); save(); toast("Saved!"); vState=null; showView('gateway');
}
function saveVoucher() {
  if (!vState.party) return toast("Party select", false); if (!vState.items.length) return toast("Koi line nahi", false);
  const t = calcTotals(); const isSaleSide = vState.type==='Sale'||vState.type==='Debit Note'; const isPurchaseSide = vState.type==='Purchase'||vState.type==='Credit Note';
  const moves = []; vState.items.forEach(li=>{ if (isSaleSide) moves.push({name:li.name, qty:-li.qty}); else if (isPurchaseSide) moves.push({name:li.name, qty:+li.qty}); });
  if (vState.editing) { const idx = DB.vouchers.findIndex(x=>x.id===vState.editId); if (idx>=0) { Object.assign(DB.vouchers[idx], { date:vState.date, party:vState.party, partyGstin:vState.partyGstin, pos:vState.pos, items:vState.items, narration:vState.narration, taxable:t.sub, cgst:t.cgst, sgst:t.sgst, igst:t.igst, round:t.round, total:t.total, interState:t.inter, stockMoves:moves, attachment:vState.attachment }); audit(vState.type.toUpperCase()+'_EDIT', DB.vouchers[idx].voucherNo||vState.editId); } save(); toast("Updated!"); vState=null; showView('gateway'); return; }
  const v = { id:uid(), type:vState.type, date:vState.date, party:vState.party, partyGstin:vState.partyGstin, pos:vState.pos, items:vState.items, narration:vState.narration, taxable:t.sub, cgst:t.cgst, sgst:t.sgst, igst:t.igst, round:t.round, total:t.total, interState:t.inter, stockMoves:moves, attachment:vState.attachment };
  const ctr = {Sale:'sale',Purchase:'purchase','Credit Note':'credit','Debit Note':'debit'}[v.type];
  if (ctr) { v.voucherNo = v.type.slice(0,3).toUpperCase()+'-'+String(DB.counters[ctr]).padStart(4,'0'); DB.counters[ctr]++; }
  DB.vouchers.push(v); audit(v.type.toUpperCase()+'_ADD', v.voucherNo||v.total); save(); toast(`${v.type} saved! ${v.voucherNo||''}`);
  if (v.type==='Sale' && confirm("Print?")) { vState=null; printInvoice(v.id); return; } vState=null; showView('gateway');
}
function deleteVoucher(id) { const v = DB.vouchers.find(x=>x.id===id); if (!v) return; if (!confirm(`Delete ${v.type} ${v.voucherNo||''}?`)) return; DB.vouchers = DB.vouchers.filter(x=>x.id!==id); audit(v.type.toUpperCase()+'_DELETE', v.voucherNo||id); save(); toast("Deleted!"); vState=null; showView('gateway'); }

/* ---------------- POSTINGS ---------------- */
function getPostings(v) {
  const P=[]; const push=(l,dr,cr)=>{ if(l) P.push({ledger:l,dr:dr||0,cr:cr||0}); };
  if (v.type==='Sale'||v.type==='Debit Note') { push(v.party,v.total,0); push('Sales A/c',0,v.taxable); if(v.cgst)push('Output CGST',0,v.cgst); if(v.sgst)push('Output SGST',0,v.sgst); if(v.igst)push('Output IGST',0,v.igst); if(v.round)push('Round Off',v.round>0?0:v.round,v.round>0?v.round:0); }
  else if (v.type==='Purchase'||v.type==='Credit Note') { push(v.party,0,v.total); push('Purchase A/c',v.taxable,0); if(v.cgst)push('Input CGST',v.cgst,0); if(v.sgst)push('Input SGST',v.sgst,0); if(v.igst)push('Input IGST',v.igst,0); }
  else if (v.type==='Payment') { push(v.fromAcc,v.amount,0); push(v.toAcc,0,v.amount); }
  else if (v.type==='Receipt') { push(v.toAcc,v.amount,0); push(v.fromAcc,0,v.amount); }
  else if (v.type==='Journal'||v.type==='Contra') { push(v.fromAcc,v.amount,0); push(v.toAcc,0,v.amount); }
  return P;
}
function ledgerBalance(name) { const l = ledgerByName(name); let bal = l?Number(l.opening)||0:0; DB.vouchers.forEach(v=>getPostings(v).forEach(p=>{ if(p.ledger===name) bal += p.dr-p.cr; })); return bal; }

/* ---------------- ARROW NAV ---------------- */
let navTable = null, navRows = [], navIdx = -1, navOnEnter = null;
function setupNav(tableId, onEnter) {
  navTable = document.getElementById(tableId); if (!navTable) return;
  navRows = Array.from(navTable.querySelectorAll('tbody tr, tr[data-row]')); navIdx = -1; navOnEnter = onEnter;
  navRows.forEach((r,i)=>{ r.style.cursor='pointer'; r.addEventListener('click', ()=>selectNavRow(i)); r.addEventListener('dblclick', ()=>{ selectNavRow(i); if(navOnEnter) navOnEnter(navRows[i].dataset.id); }); });
}
function selectNavRow(i) { if (i<0 || i>=navRows.length) return; if (navIdx>=0 && navRows[navIdx]) navRows[navIdx].classList.remove('sel-row'); navIdx = i; navRows[i].classList.add('sel-row'); navRows[i].scrollIntoView({block:'nearest'}); }
function handleArrowNav(e) {
  if (!navTable || !navRows.length) return false;
  if (e.key==='ArrowDown') { e.preventDefault(); selectNavRow(Math.min(navRows.length-1, navIdx+1)); return true; }
  if (e.key==='ArrowUp') { e.preventDefault(); selectNavRow(Math.max(0, navIdx-1)); return true; }
  if (e.key==='Enter') { e.preventDefault(); if (navIdx<0) selectNavRow(0); const row = navRows[navIdx]; if (row && navOnEnter) navOnEnter(row.dataset.id); return true; }
  return false;
}

function exportGSTR1JSON() {
  const sales = DB.vouchers.filter(v=>v.type==='Sale');
  const b2b = sales.filter(v=>v.partyGstin).map(v=>({ ctin: v.partyGstin, inv: [{ inum: v.voucherNo||'', idt: v.date, val: v.total, pos: v.pos||'', rchrg:'N', inv_typ:'R', itms: v.items.map((li,i)=>({ num:i+1, itm_det:{ txval: li.qty*li.rate*(1-(li.disc||0)/100), rt: li.gst, iamt: li.gst? (v.interState?(li.qty*li.rate*(1-(li.disc||0)/100)*li.gst/100):0):0, camt: li.gst? (!v.interState?(li.qty*li.rate*(1-(li.disc||0)/100)*li.gst/200):0):0, samt: li.gst? (!v.interState?(li.qty*li.rate*(1-(li.disc||0)/100)*li.gst/200):0):0, csamt:0 } })) }] }));
  const b2cs = sales.filter(v=>!v.partyGstin).map(v=>({ pos:v.pos||'', txval:v.taxable, rt:v.items[0]?.gst||0, iamt:v.igst, camt:v.cgst, samt:v.sgst, csamt:0 }));
  const hsn = {}; sales.forEach(v=>v.items.forEach(li=>{ const key=(li.hsn||'-')+'|'+li.gst; if(!hsn[key])hsn[key]={hsn_sc:li.hsn||'',desc:li.name,uqc:li.uom||'NOS',qty:0,txval:0,iamt:0,camt:0,samt:0,csamt:0,rt:li.gst}; const amt=li.qty*li.rate*(1-(li.disc||0)/100); hsn[key].qty+=li.qty; hsn[key].txval+=amt; if(v.interState)hsn[key].iamt+=amt*li.gst/100; else { hsn[key].camt+=amt*li.gst/200; hsn[key].samt+=amt*li.gst/200; } }));
  const json = { gstin: DB.company.gstin||'', fp: today().slice(0,7).replace('-',''), version:'GST3.2.4', hash:'hash', b2b, b2cs, hsn: { data: Object.values(hsn) } };
  const blob = new Blob([JSON.stringify(json,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download='GSTR1_'+today()+'.json'; a.click(); URL.revokeObjectURL(url);
  audit('GSTR1_JSON_EXPORT',''); toast("GSTR-1 JSON downloaded (basic)");
}

function renderBankEntries() {
  const bank = document.getElementById('brBank').value; const el = document.getElementById('brBody'); if (!bank) { el.innerHTML=''; return; }
  const entries = []; DB.vouchers.forEach(v=>{getPostings(v).forEach(p=>{ if(p.ledger===bank && (p.dr||p.cr)) entries.push({id:v.id,date:v.date,type:v.type,no:v.voucherNo||'',dr:p.dr,cr:p.cr,narr:v.narration||v.party||'',reconciled: v.reconciled||false}); });});
  let bal=0; entries.forEach(e=>bal+=e.dr-e.cr); let recon=0; entries.forEach(e=>{ if(e.reconciled) recon+=e.dr-e.cr; });
  const rows = entries.map((e,idx)=>`<tr><td><input type="checkbox" ${e.reconciled?'checked':''} onchange="toggleRecon('${e.id}',this.checked)"></td><td>${e.date}</td><td>${e.type}</td><td>${e.no}</td><td>${e.narr}</td><td class="right">${fmt(e.dr)}</td><td class="right">${fmt(e.cr)}</td></tr>`).join('');
  el.innerHTML = `<table><tr><th>✓</th><th>Date</th><th>Voucher</th><th>No</th><th>Narration</th><th class="right">Dr</th><th class="right">Cr</th></tr>${rows}</table><div class="totals" style="margin-top:8px;"><div><span>Bank Book Balance</span><b>₹ ${fmt(bal)}</b></div><div><span>Reconciled Balance</span><b>₹ ${fmt(recon)}</b></div><div><span>Unreconciled</span><b>₹ ${fmt(bal-recon)}</b></div></div>`;
}
function toggleRecon(vid, checked) { const v = DB.vouchers.find(x=>x.id===vid); if (v) { v.reconciled = checked; audit('BANK_RECON', vid); save(); renderBankEntries(); } }

function changePassword() {
  const oldP = document.getElementById('cpOld').value;
  const newP = document.getElementById('cpNew').value;
  if (!oldP || !newP) return toast("Dono password daalein!", false);
  const usr = DB.users.find(u=>u.username === DB.session.username);
  if (!usr || usr.password !== oldP) return toast("Current password galat hai!", false);
  usr.password = newP;
  audit('PASSWORD_CHANGE', DB.session.username);
  save();
  toast("Password update ho gaya!");
  document.getElementById('cpOld').value = '';
  document.getElementById('cpNew').value = '';
}

function addUser() { const u = document.getElementById('newUser').value.trim(); const p = document.getElementById('newPass').value; if (!u||!p) return toast("Username+password", false); if (DB.users.find(x=>x.username===u)) return toast("Exists", false); DB.users.push({username:u,password:p,role:'user'}); audit('USER_ADD', u); save(); renderAdmin(); }

/* ---------------- GLOBAL BACKUP / RESTORE (TALLY STYLE) ---------------- */
function downloadBackup() { 
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'}); 
  const url = URL.createObjectURL(blob); 
  const a = document.createElement('a'); 
  a.href=url; 
  a.download='Tally_Backup_'+today()+'.json'; 
  a.click(); 
  URL.revokeObjectURL(url); 
  audit('BACKUP_DOWNLOAD',''); 
  toast("Data Backup download ho gaya!");
}

function restoreBackup(input) { 
  const f = input.files[0]; if (!f) return; 
  const r = new FileReader(); 
  r.onload = () => { 
    try { 
      const d = JSON.parse(r.result); 
      if (!d.company) return toast("Invalid backup file!", false); 
      if (!confirm("Warning: Current data overwrite ho jayega. Kya aap aage badhna chahte hain?")) return; 
      DB = d; 
      if (!DB.users) DB.users=[{username:'admin',password:'admin',role:'admin'}]; 
      if (!DB.audit) DB.audit=[]; 
      audit('BACKUP_RESTORE', f.name); 
      save(); 
      toast("Data Restore ho gaya!"); 
      showView('gateway'); 
      input.value = ''; // File input clear karein
    } catch(e) { 
      toast("File parse error! Galat format hai.", false); 
    } 
  }; 
  r.readAsText(f); 
}

/* ---------------- KEYBOARD ---------------- */
document.addEventListener('keydown', e => {
  if (!DB.session) return;
  if (['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
  if (handleArrowNav(e)) return;
  if (e.ctrlKey && e.key.toLowerCase()==='g') { e.preventDefault(); showView('gateway'); return; }
  if (e.ctrlKey && e.key.toLowerCase()==='a' && currentView==='voucher') { e.preventDefault(); if (['Sale','Purchase','Credit Note','Debit Note'].includes(vState.type)) saveVoucher(); else if (vState.type==='Manufacture') saveMfg(); else saveSimpleVoucher(); return; }
  if (e.key==='Escape') { if (currentView==='voucher') { vState=null; showView('gateway'); } return; }
  const map = {F8:'F8',F9:'F9',F10:'F10',F11:'F11',F5:'F5',F6:'F6',F7:'F7',F4:'F4',F12:'F12'};
  if (map[e.key]) { e.preventDefault(); openVoucher(map[e.key]); }
});

/* ---------------- INIT ---------------- */
load();
if (!DB.session) renderLogin();
else {
  document.getElementById('userInfo').textContent = `👤 ${DB.session.username} | Logout`;
  document.getElementById('userInfo').onclick = () => { DB.session=null; save(); renderLogin(); };
  showView(DB.company ? 'gateway' : 'company');
}
</script>
</body>
